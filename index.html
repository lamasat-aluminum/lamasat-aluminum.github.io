<style>
:root{--bg:#eef0f2;--panel:#fff;--ink:#14171a;--mut:#69727a;--line:#d9dde1;--red:#c8102e;--blue:#1f6fd6;--cad:#fbfcfd;--dim:#1f6fd6;
 --f:"IBM Plex Sans Arabic",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font:14px/1.5 var(--f);color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.num,input[type=number]{font-family:var(--mono)}
/* login */
.login{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(160deg,#101317,#2a0d13);z-index:50}
.login form{background:#fff;padding:32px;border-radius:14px;width:min(360px,92vw);text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.4)}
.login img{width:64px;height:64px;border-radius:14px}
.login h1{font-size:1.2rem;margin:12px 0 4px}.login p{color:var(--mut);margin:0 0 18px;font-size:.88rem}
.login input{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:10px;text-align:center;font-size:1.05rem}
.login .err{color:var(--red);min-height:1.4em;font-size:.85rem}
/* shell */
.top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#14171a;color:#fff;flex-wrap:wrap}
.top .brand{display:flex;align-items:center;gap:9px;margin-inline-end:14px}
.top .brand img{width:34px;height:34px;border-radius:8px;background:#fff}
.top .brand b{letter-spacing:.12em;font-size:.95rem;color:#ff5a6c;direction:ltr}
.top .brand small{display:block;font-size:.72rem;color:#aab2b9}
.tb{display:inline-flex;align-items:center;gap:6px;border:1px solid #3a4148;background:#21262b;color:#e9edf0;border-radius:7px;padding:7px 12px;cursor:pointer;font-size:.86rem;white-space:nowrap}
.tb:hover{background:#2c3238}.tb.red{background:var(--red);border-color:var(--red)}
.top .sp{flex:1}
.top select{background:#21262b;border:1px solid #3a4148;border-radius:7px;padding:7px 10px;color:#fff;max-width:260px}
.main{display:grid;grid-template-columns:270px minmax(0,1fr) 330px;min-height:0}
@media (max-width:1100px){.main{grid-template-columns:1fr;overflow:auto}.app{height:auto;min-height:100vh}}
.side{background:var(--panel);border-inline-end:1px solid var(--line);overflow:auto;min-height:0}
.props{background:var(--panel);border-inline-start:1px solid var(--line);overflow:auto;min-height:0}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.sec h3{margin:0 0 10px;font-size:.82rem;color:var(--mut);font-weight:600;letter-spacing:.02em;display:flex;justify-content:space-between;align-items:center}
.fld{display:grid;gap:3px;margin-bottom:9px}
.fld label{font-size:.78rem;color:var(--mut)}
.fld input,.fld select,.fld textarea{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff}
.fld input:focus,.fld select:focus{outline:2px solid color-mix(in srgb,var(--blue) 40%,transparent);border-color:var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.pos{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;cursor:pointer;background:#fff}
.pos.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red);background:#fff7f8}
.pos svg{width:46px;height:46px;flex:none;background:var(--cad);border-radius:4px}
.pos b{display:block;font-size:.88rem}.pos small{color:var(--mut);font-family:var(--mono);font-size:.74rem}
.pos .x{margin-inline-start:auto;border:0;background:none;color:var(--mut);cursor:pointer;font-size:1.1rem;padding:2px 6px}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 12px;cursor:pointer;font-size:.85rem}
.btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.w{width:100%}
.mini{border:1px solid var(--line);background:#f6f7f8;border-radius:5px;padding:2px 8px;cursor:pointer;font-size:.78rem}
/* canvas */
.center{display:grid;grid-template-rows:auto 1fr;min-height:0}
.tabs{display:flex;gap:2px;padding:6px 10px 0;background:#e3e6e9;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:1px solid transparent;border-bottom:0;background:none;padding:8px 14px;border-radius:7px 7px 0 0;cursor:pointer;color:var(--mut);font-weight:600;white-space:nowrap}
.tab[aria-selected=true]{background:#fff;border-color:var(--line);color:var(--ink);margin-bottom:-1px}
.view{background:#fff;overflow:auto;min-height:0;position:relative}
.cad{width:100%;height:100%;min-height:520px;display:block;background:var(--cad);
 background-image:linear-gradient(#e9edf1 1px,transparent 1px),linear-gradient(90deg,#e9edf1 1px,transparent 1px);background-size:20px 20px}
.zoombar{position:absolute;top:10px;inset-inline-end:10px;display:flex;gap:4px;z-index:2}
.zoombar button{width:32px;height:32px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:1rem}
.pane{padding:16px 18px}
table.t{width:100%;border-collapse:collapse;font-size:.85rem}
table.t th{background:#f3f5f7;text-align:start;font-weight:600;color:#3d454c;padding:7px 8px;border-bottom:1px solid var(--line);position:sticky;top:0}
table.t td{padding:6px 8px;border-bottom:1px solid #eef0f2}
table.t td.n{font-family:var(--mono);direction:ltr;text-align:end}
table.t tfoot td{font-weight:700;background:#fafbfc}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.kpi small{color:var(--mut);font-size:.76rem}.kpi b{display:block;font:600 1.15rem var(--mono);direction:ltr;text-align:end}
.kpi.big{background:#14171a;color:#fff;border-color:#14171a}.kpi.big small{color:#aab2b9}
h4.ttl{margin:18px 0 8px;font-size:.95rem}
/* cell editor */
.grid-ed{display:grid;gap:4px;margin-top:6px}
.cellbtn{border:1px dashed #b9c0c6;background:#f8f9fa;border-radius:5px;padding:5px;cursor:pointer;font-size:.74rem;text-align:center;min-height:34px}
.cellbtn.on{border:2px solid var(--blue);background:#eef5ff}
.swatches{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.swatches button{aspect-ratio:1;border-radius:5px;border:2px solid transparent;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swatches button[aria-pressed=true]{border-color:var(--red);transform:scale(1.08)}
.hint{color:var(--mut);font-size:.76rem;margin:-4px 0 8px}
.ok{color:#1f7a4d}.bad{color:var(--red)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:4px 10px;cursor:pointer;font-size:.78rem}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
/* settings modal */
.wz-steps{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}.wz-steps button{flex:1;min-width:110px;display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:#f6f7f8;border-radius:8px;padding:7px 8px;cursor:pointer;font:inherit;font-size:.8rem;color:#3d454c}
.wz-steps button b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#d9dde1;font-size:.75rem;flex:none}.wz-steps button.on{border-color:var(--red);background:#fff7f8;color:var(--ink)}.wz-steps button.on b{background:var(--red);color:#fff}.wz-steps button.done b{background:#1f7a4d;color:#fff}.wz-steps button:disabled{opacity:.45;cursor:default}
.wz-q{font-size:1.05rem;margin:4px 0 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.wz-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.wz-tools input,.wz-tools select{padding:7px 10px;border:1px solid var(--line);border-radius:7px;font:inherit;min-width:220px}
.wz-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;max-height:52vh;overflow:auto;padding:2px}.wz-card{text-align:start;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:3px;font:inherit}.wz-card:hover,.wz-card.on{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}.wz-card span{font-size:.78rem;color:var(--red)}.wz-card small{color:var(--mut);font-size:.72rem}.wz-th{font-style:normal;font-size:.7rem;color:#69727a;background:#eef0f2;border-radius:4px;padding:1px 6px;align-self:flex-start}.wz-th.on{color:#1f6fd6;background:#e6f0fc}
.wz-num{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.wz-chk{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:.9rem}
.wz-prev{background:var(--cad);border:1px solid var(--line);border-radius:9px;padding:6px;margin-top:10px}.wz-prev svg{width:100%;height:auto;max-height:46vh;display:block}.wz-prev.big svg{max-height:60vh}
.wz-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}@media(max-width:900px){.wz-two{grid-template-columns:1fr}}
.wz-grid{display:grid;gap:5px;background:#5b6268;padding:5px;border-radius:6px;direction:ltr;max-height:56vh;width:100%;margin-top:10px}.wz-cell{background:#e3f0f8;border-radius:3px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:4px;min-height:64px;direction:rtl}
.wz-cell small{font-family:var(--mono);font-size:.68rem;color:#3d454c}.wz-cell select{max-width:100%;font-size:.75rem;padding:3px;border:1px solid #9aa1a8;border-radius:4px}.wz-cell.f-panel{background:#c9ced3}.wz-cell:not(.f-fixed):not(.f-panel){background:#fff3d6}
.wz-gb{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#f7fbfd}.wz-gb select,.wz-gb input{padding:6px;border:1px solid var(--line);border-radius:6px;font:inherit;width:100%}.wz-exp{border:2px solid var(--ink);border-radius:12px;padding:12px;margin-bottom:12px}.wz-parts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}.wz-part{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}.wz-part .ic{font-size:1.6rem}.wz-part small{color:var(--mut);font-size:.75rem;flex:1}#wzToast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#14171a;color:#fff;padding:10px 18px;border-radius:9px;z-index:99;transition:.3s;opacity:0}#wzToast.show{transform:translateX(-50%);opacity:1}.wz-inc{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.wz-inc span{background:#f3f5f7;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:.78rem}.wz-warn{background:#fff3f4;border:1px solid #f3b8c1;color:#9b0d23;border-radius:8px;padding:8px 10px;font-size:.85rem;margin:6px 0}.wz-cal{border:1px dashed #9aa1a8;border-radius:10px;padding:10px;margin-top:14px;background:#fafbfc}.wz-plan summary{cursor:pointer;font-weight:600;margin:8px 0}.wz-pl{margin-bottom:10px}.wz-dims{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.wz-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);position:sticky;bottom:-18px;background:#fff;padding-bottom:6px}
.modal{position:fixed;inset:0;background:rgba(10,12,14,.55);display:grid;place-items:center;z-index:40;padding:16px}
.modal>div{background:#fff;border-radius:12px;width:min(1100px,100%);max-height:92vh;overflow:auto;padding:18px 20px}
.modal h2{margin:0 0 12px;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center}
.modal table input{width:100%;min-width:62px;padding:4px 6px;border:1px solid var(--line);border-radius:4px;font-family:var(--mono);font-size:.8rem}
.modal table td,.modal table th{padding:4px}
#accT input[data-acc=name],#accT select{font-family:var(--f)}
.scope{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-bottom:12px}
.scope button{border:0;background:#fff;padding:6px 14px;cursor:pointer;font-size:.82rem}.scope button[aria-pressed=true]{background:var(--ink);color:#fff}
.bar{display:flex;height:30px;border:1px solid #9aa3ab;border-radius:3px;overflow:hidden;margin:4px 0 2px;background:#fff}
.bar span{display:flex;align-items:center;justify-content:center;font:500 .68rem var(--mono);border-inline-end:2px solid #fff;background:#cfd8e0;color:#1b2a36;white-space:nowrap;overflow:hidden;min-width:0}
.bar span.trim{background:#8a949c}.bar span.off{background:repeating-linear-gradient(45deg,#eee 0 6px,#ddd 6px 12px);color:#666}.bar span.off.re{background:repeating-linear-gradient(45deg,#d8f0e2 0 6px,#bfe3cc 6px 12px);color:#1f7a4d}
.barmeta{display:flex;justify-content:space-between;font-size:.74rem;color:var(--mut);margin-bottom:8px}
.st{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.74rem;font-weight:600}
.st.quote{background:#eef2f6;color:#3d4a57}.st.confirmed{background:#e6f0ff;color:#1f5fbf}.st.production{background:#fff3dc;color:#9a6200}.st.installed{background:#e7f6ee;color:#1f7a4d}.st.delivered{background:#14171a;color:#fff}.st.lost{background:#fde8eb;color:#b3261e}
.pay{display:flex;justify-content:space-between;font-size:.8rem;padding:4px 0;border-bottom:1px dashed var(--line)}
.pay button{border:0;background:none;color:var(--mut);cursor:pointer}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 8px;font-size:.76rem}.sum3 div{background:#f6f7f8;border-radius:6px;padding:5px 7px}.sum3 b{display:block;font:600 .82rem var(--mono);direction:ltr;text-align:end}
/* ═══ واجهة بأسلوب LogiKal ═══ */
.app{display:grid;grid-template-rows:auto auto auto auto 1fr auto;height:100vh;background:#fff}
.lk-title{display:flex;align-items:center;justify-content:space-between;background:#2b5797;color:#fff;height:36px;padding:0 8px;font-size:.84rem;gap:10px}
.lk-tl{display:flex;align-items:center;gap:10px}.lk-tl img{width:22px;height:22px;border-radius:4px;background:#fff}
.lk-find{display:flex;align-items:center;gap:6px;background:#fff;color:#555;border-radius:2px;padding:3px 8px;width:280px}
.lk-find input{border:0;outline:0;width:100%;font-size:.82rem}
.lk-tc{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lk-tr{display:flex;align-items:center;gap:6px}.lk-wb{background:none;border:0;color:#fff;cursor:pointer;padding:4px 10px;font-size:.8rem}.lk-wb:hover{background:rgba(255,255,255,.15)}
.lk-tabs{display:flex;background:#2b5797;padding:0 4px;gap:2px}
.lk-tabs button{background:none;border:0;color:#fff;padding:5px 14px;font-size:.82rem;cursor:pointer}
.lk-tabs button[aria-selected=true]{background:#f3f3f3;color:#2b5797;font-weight:600}
.lk-ribbon{display:flex;align-items:stretch;background:#f3f3f3;border-bottom:1px solid #d5d5d5;min-height:88px;padding:4px 6px 0;overflow-x:auto;gap:0}
.lk-grp{display:flex;flex-direction:column;border-inline-end:1px solid #d8d8d8;padding:0 6px}
.lk-grp .gb{display:grid;grid-auto-flow:column;grid-template-rows:repeat(3,auto);gap:0 6px;flex:1}
.lk-grp .gt{text-align:center;font-size:.72rem;color:#555;padding:2px 0 3px}
.lk-b{display:flex;align-items:center;gap:5px;background:none;border:1px solid transparent;font-size:.78rem;padding:1px 5px;cursor:pointer;white-space:nowrap;color:#222;border-radius:2px;text-align:start;line-height:1.55}
.lk-b:hover{background:#dbe7f7;border-color:#a9c3e8}
.lk-b svg{width:13px;height:15px;flex:none}
.lk-big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:72px;font-size:.78rem;border:1px solid transparent;background:none;cursor:pointer;padding:4px 8px;color:#222}
.lk-big:hover,.lk-big[aria-expanded=true]{background:#cfe0f5;border-color:#a9c3e8}
.lk-big .ic{font-size:1.5rem;line-height:1}
.lk-drop{position:absolute;z-index:30;background:#fff;border:1px solid #b9b9b9;box-shadow:0 6px 16px rgba(0,0,0,.2);padding:6px 8px 2px}
.lk-drop .gb{display:grid;grid-auto-flow:column;grid-template-rows:repeat(3,auto);gap:0 10px}
.lk-drop .gt{text-align:center;font-size:.72rem;color:#555;border-top:1px solid #e3e3e3;margin-top:4px;padding-top:2px}
.lk-crumb{display:flex;align-items:center;gap:4px;padding:4px 6px;border-bottom:1px solid #e1e1e1;background:#fff}
.lk-crumb button{background:none;border:0;font-size:1rem;color:#555;cursor:pointer;width:28px}.lk-crumb button:disabled{color:#bbb}
.lk-path{flex:1;border:1px solid #d6d6d6;padding:2px 8px;font-size:.8rem;display:flex;gap:6px;align-items:center}
.lk-path a{color:#222;text-decoration:none;cursor:pointer}.lk-path a:hover{text-decoration:underline}
.lk-body{min-height:0;position:relative}
.lk-body>section,.lk-body>.main{height:100%}
.lk-centre{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:0}
.lk-left{border-inline-end:1px solid #d6d6d6;overflow:auto;display:flex;flex-direction:column;font-size:.82rem}
.lk-left h1{color:#2b5797;font-weight:500;font-size:1.15rem;margin:8px 12px 4px}
.lk-sec>summary{color:#2b5797;cursor:pointer;padding:3px 10px;list-style:none;font-size:.82rem}
.lk-sec>summary::before{content:"˅ ";color:#555}.lk-sec:not([open])>summary::before{content:"› "}
.lk-kv{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;padding:2px 14px 6px;font-size:.8rem}
.lk-kv span:nth-child(odd){color:#333}
.lk-doc svg{width:13px;height:15px;flex:none}
.lk-doc{display:flex;gap:6px;align-items:center;padding:2px 14px;cursor:pointer;font-size:.8rem}.lk-doc:hover{background:#eef4fc}
.lk-fill{display:grid;grid-template-columns:16px 1fr auto;gap:6px;align-items:center;padding:2px 14px;font-size:.8rem}
.lk-fill i{width:13px;height:13px;border:1px solid #555;display:inline-block}
.lk-trash{margin-top:auto;border-top:1px solid #ddd;text-align:center;padding:10px}.lk-trash button{background:none;border:0;font-size:1.5rem;cursor:pointer;color:#555}
.lk-pos{overflow:auto;padding:6px 10px;position:relative}
.lk-new{display:flex;gap:40px;padding:4px 6px 0}.lk-new a{color:#2b5797;cursor:pointer;font-size:.86rem;text-decoration:none}.lk-new a::before{content:"+ ";font-size:1rem}
.lk-cols{display:grid;grid-template-columns:100px 66px 110px 68px 1fr;font-size:.76rem;color:#555;border-bottom:1px solid #ddd;padding:6px 6px 4px;margin-top:6px}
.lk-cols span{border-inline-end:1px solid #e2e2e2;padding-inline-start:4px}
.lk-ph{color:#2b5797;font-size:1.1rem;padding:6px;border-bottom:1px solid #e6e6e6;cursor:pointer}
.lk-row{display:grid;grid-template-columns:100px 66px 110px 68px 1fr;padding:8px 6px;border-bottom:1px solid #f0f0f0;font-size:.8rem;cursor:default}
.lk-row:hover{background:#f5f9fe}.lk-row.sel{background:#dbe9fa}
.lk-row .th{width:120px;height:120px;margin-top:4px}
.lk-row .th svg{width:100%;height:100%}
.lk-row .desc{display:grid;grid-template-columns:90px 1fr;gap:1px 8px}
.lk-row .desc b{grid-column:1/-1;font-weight:500;margin-bottom:6px}
.lk-row select{font-size:.76rem;border:1px solid #ddd;background:#fff;padding:1px}
.lk-row .act{grid-column:1/-1;display:flex;gap:6px;margin-top:6px}
.lk-row .act button{font-size:.74rem;border:1px solid #ccc;background:#fff;border-radius:2px;padding:2px 8px;cursor:pointer}
.lk-status{display:flex;justify-content:space-between;border-top:1px solid #d6d6d6;background:#f3f3f3;font-size:.74rem;color:#444;padding:3px 10px}
.lk-status span{padding:0 10px;border-inline-end:1px solid #ccc}
.lk-hidden{display:none}
.app{max-width:100vw;overflow-x:hidden}.lk-tabs,.lk-ribbon{max-width:100vw}.lk-tabs{overflow-x:auto}
@media (max-width:700px){.lk-find,.lk-tc{display:none}.lk-cols{display:none}.lk-row{grid-template-columns:80px minmax(0,1fr)}.lk-row>div:nth-child(2),.lk-row>div:nth-child(3),.lk-row>div:nth-child(4){display:none}.lk-row .th{width:76px;height:76px}.lk-left{max-height:40vh}.lk-new{gap:16px;flex-wrap:wrap}}
@media (max-width:1100px){.lk-centre{grid-template-columns:1fr}.lk-cols,.lk-row{grid-template-columns:80px 50px 90px 56px 1fr}}

  <pattern id="net" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M0 0H12M0 0V12" stroke="#445" stroke-width=".8" opacity=".4"/></pattern>
  <marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 2L10 5L0 8z" fill="#1f6fd6"/></marker>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c8102e"/></marker>
  <style>.dim line{stroke:#1f6fd6}.dim text{fill:#1f6fd6;font-family:'IBM Plex Mono',monospace;font-weight:500}</style></defs>

/* ═══════════ المقطع (Section) ═══════════ */
function drawSection(p){
  const s=sys(p.sys),gl=gls(p.glass),c=col(p.color),fc=c.hex,K=5,D=s.depth;
  const al=`fill="${fc}" stroke="#1b1f23" stroke-width="1.4"`;
  const tbreak=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#3a3f45"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#hatch2)"/>`;
  const chambers=(x,y,w,h,n)=>{let r="";const cw=(w-6)/n;for(let i=0;i<n;i++)r+=`<rect x="${x+3+i*cw+1.5}" y="${y+3}" width="${cw-3}" height="${h-6}" fill="#fff" stroke="#1b1f23" stroke-width=".9"/>`;return r;};
  const gasket=(x,y,w=4,h=6)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.5" fill="#111"/>`;
  const callout=(x,y,tx,ty,label)=>`<path d="M${x} ${y}L${tx} ${ty}H${tx+(tx>x?40:-40)}" stroke="#c8102e" fill="none" stroke-width="1.1"/><circle cx="${x}" cy="${y}" r="2.6" fill="#c8102e"/><text x="${tx+(tx>x?44:-44)}" y="${ty+4}" font-size="12.5" text-anchor="${tx>x?"start":"end"}" fill="#1b1f23">${label}</text>`;
  let o="",L=[];
  // إحداثيات بالمم: x = العمق (خارج ← داخل)، y = عرض الوجه
  if(s.kind==="facade"){
    const Mw=s.M,Dp=s.depth,gT=gl.t;let dims0;
    // قائم الواجهة (T) من الداخل، الزجاج خارج القائم، كبّاس وغطاء خارجي
    o+=`<rect x="${gT+16}" y="0" width="${Dp-gT-16}" height="${Mw}" ${al}/>`+chambers(gT+16,0,Dp-gT-16,Mw,3);
    o+=glassUnitH(6,-130,gl,130+Mw/2-3)+glassUnitH(6,Mw/2+3,gl,130+Mw/2-3);
    o+=`<rect x="0" y="${Mw/2-14}" width="6" height="28" fill="${shade(fc,-.1)}" stroke="#1b1f23"/><rect x="-12" y="${Mw/2-Mw/2}" width="12" height="${Mw}" rx="2" ${al}/>`;
    o+=tbreak(6,Mw/2-5,gT+10,10);o+=gasket(gT+8,Mw/2-14,6,8)+gasket(gT+8,Mw/2+6,6,8)+gasket(1,Mw/2-14,4,6)+gasket(1,Mw/2+8,4,6);
    L.push([Dp*.7,Mw*.5,Dp+70,Mw*.2,`قائم واجهة ${Mw}×${Dp-gT-16}مم`]);L.push([-6,Mw*.2,-70,-60,"غطاء خارجي (كاب)"]);L.push([3,Mw*.5,-70,Mw*.5,"كبّاس (Pressure plate)"]);
    L.push([gT/2+6,Mw+60,-70,Mw+70,`زجاج ${gl.n} (${gT}مم)`]);L.push([gT+10,Mw/2+10,Dp+70,Mw+40,"جوان EPDM داخلي"]);L.push([gT/2+6,Mw/2,Dp+70,Mw*.75,"عازل حراري"]);
    var dims=[["h",-12,Dp,-150,`${Dp+12}`],["v",0,Mw,Dp+30,`${Mw}`]],H=Mw+150;
    o=`<g transform="translate(0 150)">${o}</g>`;L=L.map(a=>[a[0],a[1]+150,a[2],a[3]+150,a[4]]);dims=dims.map(d=>d[0]==="v"?[d[0],d[1]+150,d[2]+150,d[3],d[4]]:[d[0],d[1],d[2],d[3]+150,d[4]]);H=Mw+300;
  }else if(s.kind==="shutter"){
    const G=s.F,Sh=s.S;
    o+=`<path d="M0 0H${G}V${Sh*3+20}H${G-8}V8H8V${Sh*3+20}H0Z" ${al}/>`;
    for(let i=0;i<3;i++){const y=14+i*Sh;o+=`<path d="M16 ${y}h${G-32}q6 ${Sh/2} 0 ${Sh-2}h-${G-32}q-6 -${Sh/2} 0 -${Sh-2}z" fill="${shade(fc,.06)}" stroke="#1b1f23"/><rect x="${G/2-10}" y="${y+Sh/2-3}" width="20" height="6" fill="#fff" stroke="#1b1f23" stroke-width=".6"/>`;}
    o+=`<rect x="8" y="${Sh*3+20}" width="${G-16}" height="8" fill="#555"/>`;
    L.push([G-4,Sh,G+70,Sh*.5,`سكة جانبية ${G}مم`]);L.push([G/2,14+Sh*1.5,-70,Sh*1.5,`شريحة ${Sh}مم معزولة`]);L.push([10,Sh*3+24,-70,Sh*3+40,"فرشاة"]);
    var dims=[["h",0,G,-24,`${G}`],["v",14,14+Sh,G+30,`${Sh}`]],H=Sh*3+80;
  }else if(s.kind==="sliding"){
    const tr=s.tracks,trW=(D-8)/tr,F=s.F,S=s.S;
    o+=`<path d="M0 0H${D}V${F}H0Z" ${al}/>`;
    for(let i=0;i<tr;i++){const x=4+i*trW;o+=`<rect x="${x+trW/2-1.5}" y="${F}" width="3" height="10" fill="#1b1f23"/>`;}
    o+=chambers(0,0,D,F*.55,tr+1);
    // درفتين على سكتين
    const sashes=Math.min(tr,2);
    for(let i=0;i<sashes;i++){
      const x=4+i*trW+2,w=trW-4,y=F+10+i*0;
      o+=`<rect x="${x}" y="${y}" width="${w}" height="${S}" ${al}/>`+chambers(x,y,w,S*.7,1);
      const gx=x+w/2-gl.t/2;o+=glassUnit(gx,y+S-14,gl,150);
      o+=gasket(gx-5,y+S-12)+gasket(gx+gl.t+1,y+S-12);
      o+=`<rect x="${x+1}" y="${y-3}" width="${w-2}" height="3" fill="#777"/>`;
      if(i===0)L.push([x+w/2,y+S/2,-60,y+S/2,"درفة جرارة — سكة خارجية"]);else L.push([x+w/2,y+S/2,D+60,y+S/2+10,"درفة جرارة — سكة داخلية"]);
    }
    L.push([D/2,F*.3,D+60,F*.2,`إطار جرار ${tr} سكة — عمق ${D}مم`]);
    L.push([4+trW/2,F+5,-60,F+5,"سكة + عجلة"]);
    L.push([4+trW+2,F+10+S+60,D+60,F+10+S+60,`زجاج ${gl.n}`]);
    var dims=[["h",0,D,-24,`${D}`],["v",0,F,-24,`${F}`],["v",F+10,F+10+S,D+24,`${S}`]],H=F+10+S+160;
  }else{
    const F=s.F,S=s.S,ov=s.ov,tbx=D*.44,tbw=D*.12;
    // الإطار L
    o+=`<path d="M0 0H${D}V${F}H${D*.62}V${F-ov-4}H0Z" ${al}/>`;
    o+=chambers(0,0,tbx,F-ov-4,2)+chambers(tbx+tbw,0,D-tbx-tbw,F*.62,2);
    o+=tbreak(tbx,4,tbw,F-ov-12);
    // الدرفة
    const sy=F-ov,sx=6,sd=D+8;
    o+=`<path d="M${sx} ${sy}H${sx+sd}V${sy+S}H${sx+sd*.7}V${sy+S-18}H${sx}Z" ${al}/>`;
    o+=chambers(sx,sy,sd*.42,S-22,1)+chambers(sx+sd*.42+tbw,sy,sd*.58-tbw,S-4,2)+tbreak(sx+sd*.42,sy+4,tbw,S-26);
    // جوانات الإطار/الدرفة
    o+=gasket(D*.62+2,F-ov-4,5,5)+gasket(3,sy-5,5,5)+gasket(tbx+tbw/2-2,sy-6,5,6);
    // الزجاج + الخرزة
    const gx=sx+sd*.36-gl.t/2;o+=glassUnit(gx,sy+S-18,gl,170);
    o+=gasket(gx-5,sy+S-16)+gasket(gx+gl.t+1,sy+S-16);
    o+=`<path d="M${gx+gl.t+5} ${sy+S-18}h${sd*.64-gl.t-sd*.36+gl.t/2-2}v-16h-6v10h${-(sd*.64-gl.t-sd*.36+gl.t/2-8)}z" fill="${shade(fc,-.08)}" stroke="#1b1f23"/>`;
    L.push([D*.8,F*.3,D+70,F*.15,`إطار — سلسلة ${D}مم`]);
    L.push([tbx+tbw/2,F*.4,-70,F*.2,"قاطع حراري (بولي أميد)"]);
    L.push([sx+sd*.85,sy+S*.35,D+70,sy+S*.1,s.kind==="door"?"ضلفة باب":"درفة مفصلي"]);
    L.push([gx+gl.t/2,sy+S+90,-70,sy+S+90,`زجاج ${gl.n} (${gl.t}مم)`]);
    L.push([gx-3,sy+S-13,-70,sy+S-30,"جوان EPDM"]);
    L.push([gx+gl.t+12,sy+S-26,D+70,sy+S+30,"خرزة زجاج"]);
    var dims=[["h",0,D,-24,`${D}`],["v",0,F,-24,`${F}`],["v",sy,sy+S,D+30,`${S}`]],H=F+S+200;
  }
  let d="";dims.forEach(([t,a,b,at,lab])=>{if(t==="h")d+=dimH(a,b,at,lab,0,1);else d+=dimV(a,b,at,lab,1);});
  let lab="";L.forEach(a=>lab+=callout(...a));
  const vbW=D+600;DS=0.75;
  return `<svg xmlns="http://www.w3.org/2000/svg" class="cad" direction="ltr" viewBox="-300 -80 ${vbW} ${H+120}" preserveAspectRatio="xMidYMid meet" font-family="IBM Plex Sans Arabic,sans-serif">
   <defs><pattern id="hatch2" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="4" stroke="#fff" stroke-width=".7" opacity=".5"/></pattern>
   <marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="2.4" markerHeight="2.4" orient="auto-start-reverse"><path d="M0 2L10 5L0 8z" fill="#1f6fd6"/></marker>
   <style>.dim line{stroke:#1f6fd6}.dim text{fill:#1f6fd6;font-family:'IBM Plex Mono',monospace;font-size:10px}</style></defs>
   <text x="${D/2}" y="-56" text-anchor="middle" font-size="15" font-weight="700">${s.kind==="shutter"?"مقطع السكة والشرائح":"مقطع أفقي"} — ${esc(s.name)}</text>
   <text x="-280" y="-56" font-size="12" fill="#69727a">← خارج</text><text x="${D+280}" y="-56" font-size="12" fill="#69727a" text-anchor="end">داخل →</text>
   ${o}${d}${lab}
   <text x="${D/2}" y="${H+30}" text-anchor="middle" font-size="11" fill="#69727a">مقياس تقريبي 1:1 · اللون ${esc(c.n)} (${esc(c.code)}) · رسم تخطيطي للمقطع</text></svg>`;
}
function glassUnitH(x,y,gl,len){let r="",xx=x;gl.layers.forEach((t,i)=>{const gap=gl.layers.length===3&&i===1;r+=`<rect x="${xx}" y="${y}" width="${t}" height="${len}" fill="${gap?"#f4fbff":"#bfe0f2"}" stroke="${gap?"none":"#4d7a96"}" stroke-width=".8"/>`;xx+=t;});return r;}
function glassUnit(x,y,gl,len){let r="",xx=x;gl.layers.forEach((t,i)=>{const isGap=gl.layers.length===3&&i===1;
  if(isGap){r+=`<rect x="${xx}" y="${y}" width="${t}" height="12" fill="#c9ced3" stroke="#555" stroke-width=".6"/><rect x="${xx}" y="${y+12}" width="${t}" height="${len-12}" fill="#f4fbff"/>`;}
  else r+=`<rect x="${xx}" y="${y}" width="${t}" height="${len}" fill="#bfe0f2" stroke="#4d7a96" stroke-width=".8"/>`;xx+=t;});
  return r+`<path d="M${x-2} ${y+len}l${(xx-x)/2+2} 8l${(xx-x)/2+2} -8" fill="none" stroke="#999" stroke-width=".6"/>`;}

   <div class="fld"><label>الارتفاع مم</label><input type="number" data-k="H" value="${p.H}" min="300" step="1"></div>

     <div class="fld"><label>منخل</label><select data-k="net"><option value="1" ${p.net?"selected":""}>نعم</option><option value="0" ${!p.net?"selected":""}>لا</option></select></div></div>`;

  if(s.kind==="facade"&&LIB[s.id]){const L=LIB[s.id],o=(role,v)=>L.filter(x=>x[5]===role).map(x=>`<option value="${x[0]}" ${x[0]===v?"selected":""}>${x[0]} — ${esc(x[1])} · ${x[2]} كغم/م · Jx ${x[3]}</option>`).join("");

  h+=`</div>`;

function upd(fn){fn();const _p=POS();if(_p){_p.mod=Date.now();_p.by=USER;}save();renderPosList();renderProps();renderView();}
$("props").addEventListener("change",e=>{
  const p=POS(),t=e.target;
  if(t.dataset.cellfill!==undefined){upd(()=>p.cells[selCell]=t.value);return;}
  if(t.dataset.rows!==undefined){const v=t.value.split(/[,،\s]+/).map(Number).filter(n=>n>0);if(v.length)upd(()=>p.rows[+t.dataset.rows]=v);return;}
  const k=t.dataset.k;if(!k)return;
  upd(()=>{
    if(k==="colsTxt"){const v=t.value.split(/[,،\s]+/).map(Number).filter(n=>n>0);if(v.length){p.cols=v;p.rows=v.map((_,i)=>p.rows[i]||[p.H]);}return;}
    if(k==="sys"){const old=sys(p.sys).kind;p.sys=t.value;["frameP","sashP","mullP","transP","interP","beadP","netP","slatP","boxP"].forEach(z=>delete p[z]);const nk=sys(p.sys).kind;if(isGrid(sys(p.sys))&&!p.cols.length){p.cols=[p.W];p.rows=[[p.H]];p.cells={"0-0":nk==="door"?"doorL":"casL"};}
      if(nk!=="door")Object.keys(p.cells).forEach(c=>{if(p.cells[c].startsWith("door"))p.cells[c]="casL"});return;}
    if(k==="W"||k==="H"){const v=Math.max(1,+t.value||0),old=p[k];p[k]=v;
      if(p.cols.length){if(k==="W"){const sc=v/old;p.cols=p.cols.map(c=>Math.round(c*sc));p.cols[p.cols.length-1]+=v-p.cols.reduce((a,b)=>a+b,0);}
        else p.rows=p.rows.map(r=>{const sc=v/old,n=r.map(x=>Math.round(x*sc));n[n.length-1]+=v-n.reduce((a,b)=>a+b,0);return n;});}return;}
    if(k==="qty"&&p.type)p.qty=Math.max(0,+t.value||0);else if(k==="price")p.price=+t.value||0;else if(k==="qty"||k==="sashes")p[k]=Math.max(1,+t.value||1);
    else if(k==="net")p.net=t.value==="1";
    else if(k==="motor")p.motor=t.value==="1";
    else if(k==="shutter")p.shutter=t.checked;
    else p[k]=t.value;
  });
});

/* ═══════════ أرشيف LogiKal (مخزّن بـ IndexedDB حتى ما يمتلي التخزين) ═══════════ */
const LKA={db:null,
  open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);const r=indexedDB.open("lamsat-logikal",1);r.onupgradeneeded=()=>r.result.createObjectStore("p",{keyPath:"lk"});r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error);});},
  async put(list){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction("p","readwrite"),st=tx.objectStore("p");list.forEach(x=>st.put(x));tx.oncomplete=()=>res(list.length);tx.onerror=()=>rej(tx.error);});},
  async all(){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction("p").objectStore("p").getAll();q.onsuccess=()=>res(q.result.sort((a,b)=>b.lk-a.lk));q.onerror=()=>rej(q.error);});}
};
let LKA_ROWS=[];

  if(!LKA_ROWS.length){$("lkaBody").innerHTML=`<p class="hint">الأرشيف فارغ. اضغط «إضافة ملف أرشيف» واختر ملف logikal-archive.json</p>`;return;}
  $("lkaBody").innerHTML=`<table class="t"><thead><tr><th>رقم LogiKal</th><th>المشروع</th><th>القطع</th><th>الكمية</th><th>الأنظمة</th><th></th></tr></thead><tbody>`+
   rows.slice(0,300).map(p=>{const sy=[...new Set(p.pos.map(x=>x.sys.split(" - ")[0]))].slice(0,4).join("، ");const qty=p.pos.reduce((a,x)=>a+x.q,0);

function lkToProject(a){
  const ex=DB.projects.find(p=>p.lk===a.lk);if(ex)return ex;

  a.pos.forEach(x=>{const n=newPos(x.k);const s=ST().systems.find(y=>y.id===x.s);if(s)n.sys=s.id;

    h=`<div class="pp">${head}<p><b>المشروع:</b> ${esc(prj.cust)} · ${esc(prj.no)} · طول العمود ${fmt(ST().prod.bar)}مم</p><table><thead><tr><th>المقطع</th><th>النظام</th><th>اللون</th><th>عدد الأعمدة</th><th>الوزن كغم</th><th>الهدر %</th></tr></thead><tbody>
     ${res.map(r=>`<tr><td>${PROF[r.type]||r.type}</td><td>${esc(sys(r.sys).name)}</td><td>${esc(r.color)}</td><td class="n">${r.bars.length}</td><td class="n">${fmt(r.kgStock,1)}</td><td class="n">${fmt(r.waste,1)}</td></tr>`).join("")}</tbody>

  }
  return h;
}

function hours(x){if(x.type)return 0;const s=sys(x.sys),H=ST().hours,g=geom(x);const sashes=s.kind==="sliding"?g.n:s.kind==="shutter"?0:g.cells.filter(c=>c.fill!=="fixed"&&c.fill!=="panel").length;

  case "posDrawings":return all.map((o,i)=>page(`رسم القطعة ${i+1}`,drawPos(o.x,{block:1}))).join("");
  }
  return "";
}

/* ═══════════ مستوى المشروع: تجميع ═══════════ */
function mergeCut(cuts){const m={};cuts.forEach(c=>{const k=c.pk+"#"+c.name.replace(/\s*\([^)]*\)$/,"")+"#"+c.len+"#"+c.ang;if(m[k]){m[k].n+=c.n;m[k].kg+=c.kg;}else m[k]={...c,name:c.name.replace(/\s*\([^)]*\)$/,"")};});return Object.values(m).sort((a,b)=>a.pk<b.pk?-1:a.pk>b.pk?1:b.len-a.len);}
const STATUS={quote:"عرض سعر",confirmed:"مؤكد",production:"قيد التصنيع",installed:"مُركّب",delivered:"مسلّم ومُغلق",lost:"ملغي"};
const PROF={frame:"مقطع الإطار",sash:"مقطع الدرفة",inter:"مقطع الإنترلوك",net:"مقطع المنخل",mull:"مقطع القائم / العارضة",bead:"خرزة الزجاج",panel:"حشوة ألمنيوم"};
let SCOPE="pos";
function projBom(prj=P()){const cut=[],glass=[],acc={};
  prj.positions.forEach((x,i)=>{const b=bom(x),cl=col(x.color);
    b.cut.forEach(c=>cut.push({...c,pos:i+1,color:cl.code,pk:c.pk+"|"+x.color}));
    b.glass.forEach(g=>glass.push({...g,pos:i+1,type:g.gid||x.glass,label:`${i+1}. ${x.name||"قطعة"} — ${g.label}`}));
    Object.entries(b.acc).forEach(([k,n])=>acc[k]=(acc[k]||0)+n);});
  return {cut,glass,acc};}
function projTotals(prj=P()){const all=prj.positions.map(x=>({x,r:pricing(x)}));const gross=all.reduce((a,o)=>a+o.r.total,0);
  const disc=gross*(+prj.discount||0)/100,net=gross-disc,paid=(prj.payments||[]).reduce((a,p)=>a+ +p.amt,0);
  return {all,gross,disc,net,paid,rem:net-paid,kg:all.reduce((a,o)=>a+o.r.kg,0),m2:all.reduce((a,o)=>a+o.r.area,0)};}

/* ═══════════ أمثلية القص (FFD) ═══════════ */
function optimize(cuts){
  const pr=ST().prod,groups={};
  cuts.forEach(c=>{if(c.type==="panel"||!c.kgm)return;const g=groups[c.pk]||(groups[c.pk]={pk:c.pk,type:c.type,sys:c.pk.split(":")[0],color:c.color||"",kgm:c.kgm,pieces:[]});
    for(let i=0;i<c.n;i++)g.pieces.push({len:c.len,name:c.name,ang:c.ang,pos:c.pos});});
  return Object.values(groups).map(g=>{const ss=ST().systems.find(x=>x.id===g.sys)||{},BAR=+ss.bar||pr.bar,kerf=ss.kerf??pr.kerf,trim=ss.trim??pr.trim,usable=BAR-2*trim;
    g.pieces.sort((a,b)=>b.len-a.len);const bars=[],over=[];
    g.pieces.forEach(pc=>{if(pc.len>usable){over.push(pc);return;}
      let b=null;bars.forEach(x=>{const need=pc.len+(x.pieces.length?kerf:0);if(x.rem>=need&&(!b||x.rem<b.rem))b=x;});
      if(!b){b={pieces:[],rem:usable};bars.push(b);}
      b.rem-=pc.len+(b.pieces.length?kerf:0);b.pieces.push(pc);});
    bars.forEach(b=>{b.used=usable-b.rem;});
    const totalPieces=g.pieces.reduce((a,p)=>a+p.len,0),stock=bars.length*BAR;
    return {...g,BAR,kerf,trim,bars,over,totalPieces,stock,waste:stock?100*(stock-totalPieces)/stock:0,kgStock:stock/1000*g.kgm,kgNet:totalPieces/1000*g.kgm};
  });
}
function renderOpt(v){
  const pr=ST().prod,src=SCOPE==="pos"?bom(POS()).cut.map(c=>({...c,color:col(POS().color).code,pk:c.pk+"|"+POS().color,pos:1})):projBom().cut;
  const res=optimize(src),bars=res.reduce((a,r)=>a+r.bars.length,0),st=res.reduce((a,r)=>a+r.stock,0),used=res.reduce((a,r)=>a+r.totalPieces,0);
  let h=`<div class="pane">${scopeBtns()}<div class="kpis"><div class="kpi big"><small>أعمدة ${fmt(pr.bar)}مم المطلوبة</small><b>${bars}</b></div><div class="kpi"><small>الهدر الكلي</small><b>${fmt(st?100*(st-used)/st:0,1)}%</b></div><div class="kpi"><small>وزن الأعمدة كغم</small><b>${fmt(res.reduce((a,r)=>a+r.kgStock,0),1)}</b></div><div class="kpi"><small>عرض المنشار / حواف</small><b>${pr.kerf} / ${pr.trim}</b></div></div>`;
  res.forEach(r=>{h+=`<h4 class="ttl">${PROF[r.type]||r.type} — <span style="color:#69727a;font-weight:500">${esc(sys(r.sys).name)} · ${esc(r.color)}</span> <span class="num" style="float:left">${r.bars.length} عمود · هدر ${fmt(r.waste,1)}%</span></h4>`;
    if(r.over.length)h+=`<div class="bad" style="font-size:.8rem">⚠ ${r.over.length} قطعة أطول من العمود (${r.over.map(o=>fmt(o.len)).join("، ")}مم) — تحتاج وصلة أو عمود أطول.</div>`;
    r.bars.forEach((b,i)=>{h+=`<div class="bar"><span class="trim" style="flex:${pr.trim}"></span>${b.pieces.map(pc=>`<span style="flex:${pc.len}" title="${esc(pc.name)} — قطعة ${pc.pos}">${fmt(pc.len)}</span>`).join("")}${b.rem>0?`<span class="off ${b.rem>=pr.reuse?"re":""}" style="flex:${b.rem}">${b.rem>=60?fmt(b.rem):""}</span>`:""}<span class="trim" style="flex:${pr.trim}"></span></div>
      <div class="barmeta"><span>عمود ${i+1} · ${b.pieces.length} قطعة</span><span>مستخدم ${fmt(b.used)} · ${b.rem>=pr.reuse?"<b class='ok'>فضلة قابلة للاستخدام "+fmt(b.rem)+"</b>":"هدر "+fmt(b.rem)}</span></div>`;});});
  v.innerHTML=h+`<p class="hint">الترتيب بطريقة «الأطول أولاً». الفضلات الخضراء (أطول من ${fmt(pr.reuse)}مم) خزّنها للشغل الجاي.</p></div>`;
}
function scopeBtns(){return `<div class="scope"><button type="button" data-scope="pos" aria-pressed="${SCOPE==="pos"}">القطعة الحالية</button><button type="button" data-scope="proj" aria-pressed="${SCOPE==="proj"}">المشروع كامل</button></div>`;}

/* ═══════════ الحرارة (ISO 10077-1 مبسّط) والمتانة ═══════════ */
function physics(p){
  if(p.type)return {A:0,Ag:0,Af:0,lg:0,Uw:0,Ug:0,Uf:0,kgAl:0,kgGl:0,mem:[],s:sys(p.sys),gl:gls(p.glass)};
  const one={...p,qty:1},s=sys(p.sys),gl=gls(p.glass),ph=ST().phys,b=bom(one),bite=ph.bite;
  const A=p.W*p.H/1e6;let Ag=0,lg=0;
  b.glass.forEach(g=>{const w=Math.max(0,g.w-2*bite),h=Math.max(0,g.h-2*bite);Ag+=w*h/1e6*g.n;lg+=2*(w+h)/1000*g.n;});
  const Af=Math.max(0,A-Ag),Uw=s.kind==="shutter"?s.Uf:A?(Ag*gl.ug+Af*s.Uf+lg*ph.psi)/A:0;
  const kgAl=b.cut.reduce((a,c)=>a+c.kg,0),glassMM=gl.layers.length===3?gl.layers[0]+gl.layers[2]:gl.layers.reduce((a,b)=>a+b,0);
  const kgGl=s.kind==="shutter"?0:b.glass.reduce((a,g)=>a+g.w*g.h/1e6*g.n,0)*glassMM*2.5;
  // متانة: انحراف القوائم/الإنترلوك تحت ضغط الرياح
  const q=ph.wind*1e-6,E=ph.E,mem=[];
  const chk=(name,L,b,Ix)=>{const w=q*b,I=Ix*1e4,f=5*w*L**4/(384*E*I),al=Math.min(L/ph.limit,ph.maxDef),Ireq=5*w*L**4/(384*E*al)/1e4;mem.push({name,L,b,f,al,ok:f<=al,Ireq});};
  if(s.kind==="shutter"){}else if(s.kind==="sliding"){const g=geom(p),pr=posProf(p,s,"inter")||posProf(p,s,"sash");if(g.n>1)chk(`إنترلوك الدرف${pr?" "+pr.code:""}`,g.sh,g.sw,pr&&libI(pr)?libI(pr):s.Ix);}
  else if(s.kind==="facade"&&libP(s.id,p.mullP||defRole(s.id,"mull"))){const FM=libP(s.id,p.mullP||defRole(s.id,"mull")),FT=libP(s.id,p.transP||defRole(s.id,"trans"));
    for(let i=0;i<p.cols.length-1;i++)chk(`قائم ${FM.code} وسطي ${i+1}`,p.H,(p.cols[i]+p.cols[i+1])/2,libI(FM));
    p.rows.forEach((rs,ci)=>{for(let j=0;j<rs.length-1;j++)chk(`عارضة ${FT.code} عمود ${ci+1}/${j+1}`,p.cols[ci]-s.M,(rs[j]+rs[j+1])/2,libI(FT));});}
  else{const MP=posProf(p,s,"mull"),MI=MP&&libI(MP)?libI(MP):s.Ix;for(let i=0;i<p.cols.length-1;i++)chk(`قائم وسطي ${i+1}${MP?" "+MP.code:""}`,p.H-2*s.F,(p.cols[i]+p.cols[i+1])/2,MI);
    p.rows.forEach((rs,ci)=>{for(let j=0;j<rs.length-1;j++)chk(`عارضة عمود ${ci+1}/${j+1}`,p.cols[ci]-2*s.F,(rs[j]+rs[j+1])/2,s.Ix);});}
  return {A,Ag,Af,lg,Uw,Ug:gl.ug,Uf:s.Uf,kgAl,kgGl,mem,s,gl};
}
function renderPhys(v){
  const p=POS(),r=physics(p),ph=ST().phys,cls=r.Uw<=2?"ok":r.Uw<=3.2?"":"bad",word=r.Uw<=1.6?"ممتاز":r.Uw<=2.2?"جيد جداً":r.Uw<=3.2?"متوسط":"ضعيف (بدون عزل حراري)";
  v.innerHTML=`<div class="pane"><h4 class="ttl" style="margin-top:0">العزل الحراري — Uw (حسب EN ISO 10077-1 مبسّط)</h4>
   <div class="kpis"><div class="kpi big"><small>Uw للقطعة W/m²K</small><b>${fmt(r.Uw,2)}</b></div><div class="kpi"><small>التقييم</small><b class="${cls}" style="font-family:var(--f);font-size:.95rem">${word}</b></div>
   <div class="kpi"><small>Ug الزجاج</small><b>${fmt(r.Ug,1)}</b></div><div class="kpi"><small>Uf الإطار</small><b>${fmt(r.Uf,1)}</b></div><div class="kpi"><small>ψ حافة الزجاج W/mK</small><b>${fmt(ph.psi,2)}</b></div></div>
   <table class="t"><tbody><tr><td>المساحة الكلية A</td><td class="n">${fmt(r.A,3)} م²</td></tr><tr><td>مساحة الزجاج الظاهر Ag</td><td class="n">${fmt(r.Ag,3)} م² (${fmt(r.A?100*r.Ag/r.A:0,0)}%)</td></tr><tr><td>مساحة الإطار Af</td><td class="n">${fmt(r.Af,3)} م²</td></tr><tr><td>محيط الزجاج lg</td><td class="n">${fmt(r.lg,2)} م</td></tr></tbody></table>
   <p class="hint" style="margin-top:6px">Uw = (Ag·Ug + Af·Uf + lg·ψ) ÷ A — كلما قل الرقم كان العزل أحسن. قيم Uf و Ug تعدّل من الإعدادات حسب شهادة المصنّع.</p>
   <h4 class="ttl">الوزن</h4><div class="kpis"><div class="kpi"><small>ألمنيوم كغم</small><b>${fmt(r.kgAl,1)}</b></div><div class="kpi"><small>زجاج كغم</small><b>${fmt(r.kgGl,1)}</b></div><div class="kpi big"><small>وزن القطعة الواحدة كغم</small><b>${fmt(r.kgAl+r.kgGl,1)}</b></div></div>
   <h4 class="ttl">المتانة الأولية — انحراف تحت ضغط الرياح ${fmt(ph.wind)} باسكال</h4>
   ${r.mem.length?`<table class="t"><thead><tr><th>العنصر</th><th>الطول مم</th><th>عرض التحميل مم</th><th>الانحراف مم</th><th>المسموح مم</th><th>Ix المطلوب cm⁴</th><th>النتيجة</th></tr></thead><tbody>
   ${r.mem.map(m=>`<tr><td>${m.name}</td><td class="n">${fmt(m.L)}</td><td class="n">${fmt(m.b)}</td><td class="n">${fmt(m.f,2)}</td><td class="n">${fmt(m.al,2)}</td><td class="n">${fmt(m.Ireq,1)}</td><td class="${m.ok?"ok":"bad"}">${m.ok?"✓ مقبول":"✗ يحتاج تقوية"}</td></tr>`).join("")}</tbody></table>
   <p class="hint" style="margin-top:6px">عزم القصور الذاتي للمقطع Ix = ${fmt(r.s.Ix,1)} cm⁴ (من الإعدادات). الحد المسموح = الأقل بين L/${ph.limit} و ${ph.maxDef}مم. إذا «يحتاج تقوية»: استخدم مقطع أقوى أو حديد تقوية بـ Ix أكبر من المطلوب.</p>`
   :`<p class="hint">ما اكو قوائم أو عوارض أو إنترلوك بهذي القطعة حتى نفحصها.</p>`}
   <p class="hint">⚠ حساب أولي تقريبي للمساعدة بالاختيار، مو بديل عن الحساب الإنشائي المعتمد للواجهات الكبيرة.</p></div>`;
}

/* ═══════════ الحالة والدفعات وقائمة المشاريع ═══════════ */

function addSpecial(type){const prj=P(),n=newPos("casement");n.type=type;n.cols=[];n.rows=[];n.cells={};n.qty=1;n.mod=Date.now();n.by=USER;
  if(type==="text"){n.name=LANG==="ar"?"ملاحظة / بند نصي":"Text position";n.text=n.name;n.price=0;}else{n.name=LANG==="ar"?"سيليكون":"Silicone";n.unit=LANG==="ar"?"قطعة":"pcs";n.price=3500;n.qty=10;}

document.addEventListener("click",e=>{
  const t=e.target;if(!$("app")||$("app").hidden)return;
  const rt=t.closest("[data-rt]");if(rt){RTAB=rt.dataset.rt;$("lkDrop").hidden=true;renderRibbon();return;}
  const dr=t.closest("[data-drop]");if(dr){openDrop(dr.dataset.drop,dr);return;}
  const dc=t.closest("[data-doc]");if(dc){printDoc(dc.dataset.doc);return;}
  if(!t.closest("#lkDrop")&&!$("lkDrop").hidden)$("lkDrop").hidden=true;
  const vw=t.closest("[data-view]");if(vw){VIEW=vw.dataset.view;setMode("editor");return;}
  const ac=t.closest("[data-act]");if(ac){const a=ac.dataset.act,prj=P();
    if(a==="lib"){openLib();return;}
    if(a==="new"){$("newProj").click();setMode("centre");}else if(a==="list")$("listBtn").click();else if(a==="dup"){$("dupProj").click();setMode("centre");}
    else if(a==="del"){if(!confirmTop(ac))return;$("delProj").dataset.sure=1;$("delProj").click();setMode("centre");}
    else if(a==="centre")setMode("centre");else if(a==="info"){setMode("editor");$("pCust").focus();}
    else if(a==="pos"){openWizard();}
    else if(a==="word"){openExport();}
    else if(a==="posQuick"){const n=newPos($("newKind").value||"sliding");n.name=tt("kinds")[$("newKind").value||"sliding"];n.mod=Date.now();n.by=USER;prj.positions.push(n);prj.sel=n.id;save();setMode("editor");}
    else if(a==="text"||a==="mat")addSpecial(a==="text"?"text":"material");return;}
  const go=t.closest("[data-go]");if(go){setMode("centre");return;}
  const op=t.closest("[data-open]");if(op){P().sel=op.dataset.open;selCell="0-0";save();setMode("editor");return;}
  const rd=t.closest("[data-rdup]");if(rd){const prj=P(),x=prj.positions.find(y=>y.id===rd.dataset.rdup),cp=structuredClone(x);cp.id=uid();cp.mod=Date.now();prj.positions.splice(prj.positions.indexOf(x)+1,0,cp);save();renderCentre();return;}

  const mv=t.closest("[data-mv]");if(mv){const prj=P(),i=prj.positions.findIndex(y=>y.id===mv.dataset.id),j=i+ +mv.dataset.mv;if(j<0||j>=prj.positions.length)return;[prj.positions[i],prj.positions[j]]=[prj.positions[j],prj.positions[i]];save();renderCentre();return;}
  const rw=t.closest("[data-row]");if(rw&&MODE==="centre"&&!t.closest("select,button")){SELROW=rw.dataset.row;document.querySelectorAll(".lk-row").forEach(r=>r.classList.toggle("sel",r.dataset.row===SELROW));}
});

const PER={pos:"لكل قطعة",mull:"لكل قائم",trans:"لكل عارضة",jointM:"لكل متر خطوط الواجهة",sash:"لكل درفة",pane:"لكل لوح زجاج",corner:"لكل زاوية (إطار+درف)",frameM:"لكل متر محيط الإطار",fsM:"لكل متر محيط الإطار + الدرف",fcorner:"4 لكل إطار (زوايا الجرجوب)",sashM:"لكل متر محيط الدرف",glassM:"لكل متر محيط الزجاج",m2:"لكل م²"};
const APP={all:"الكل",sliding:"درف جرارة",casement:"درف مفصلي",tilt:"قلاب / مفصلي+قلاب",door:"أبواب",fixed:"ثابت",net:"منخل"};
const accKey=(sid,code)=>"c:"+sid+":"+code;
function accMeta(k){if(!k.startsWith("c:"))return null;const [,sid,code]=k.split(":");const s=ST().systems.find(x=>x.id===sid);const a=s&&(s.accs||[]).find(x=>x.code===code);return a?{name:`${a.code} — ${a.name}`,price:+a.price||0,per:a.per,pack:+a.pack||PACKS[a.code]||0,unit:a.per.endsWith("M")||a.per==="m2"?"م":""}:{name:code,price:0,pack:PACKS[code]||0};}
function accName(k){const m=accMeta(k);return m?m.name:(ACCN[k]||k);}
function accPrice(k){const m=accMeta(k);if(m)return m.price;return k==="netM2"?ST().prices.netM2:(ST().acc[k]||0);}
function accItems(p,g,s){ // عناصر الفتح والزجاج للقطعة الواحدة
  const it=[];
  if(g.kind==="sliding"){for(let i=0;i<g.n;i++)it.push({t:"sliding",w:g.sw,h:g.sh,gw:g.gw,gh:g.gh});if(p.net)it.push({t:"net",w:g.sw,h:g.sh});}
  else if(isGrid(s))g.cells.forEach(c=>{if(c.fill==="panel")return;const f=c.fill;
    const t=f==="fixed"?"fixed":f.startsWith("door")?"door":f.startsWith("tilt")?"tilt":"casement";
    it.push({t,w:c.sw||c.cw,h:c.sh||c.ch,gw:c.gw,gh:c.gh,cas:f==="tiltL"||f==="tiltR"});});
  return it;}
function customAcc(p,g,s,q){const it=accItems(p,g,s),acc={};
  const match=(x,a)=>a==="all"?x.t!=="fixed"&&x.t!=="net":a==="casement"?(x.t==="casement"||x.cas):x.t===a;
  (s.accs||[]).forEach(a=>{if(!a.code)return;let n=0;const fil=it.filter(x=>match(x,a.applies||"all")&&(!+a.minH||x.h>+a.minH));
    switch(a.per){case "pos":n=1;break;case "sash":n=fil.length;break;
      case "pane":n=(a.applies&&a.applies!=="all"?it.filter(x=>x.t===a.applies):it.filter(x=>x.t!=="net")).filter(x=>x.gw).length;break;
      case "corner":n=4+4*fil.length;break;case "frameM":n=(2*p.W+2*p.H)/1000;break;case "fcorner":n=4;break;
      case "fsM":n=(2*p.W+2*p.H)/1000+fil.reduce((s2,x)=>s2+2*(x.w+x.h),0)/1000;break;
      case "sashM":n=fil.reduce((s2,x)=>s2+2*(x.w+x.h),0)/1000;break;
      case "glassM":n=it.filter(x=>x.gw&&(a.applies==="all"||!a.applies||x.t===a.applies||match(x,a.applies))).reduce((s2,x)=>s2+2*(x.gw+x.gh),0)/1000;break;
      case "m2":n=p.W*p.H/1e6;break;
      case "mull":n=isGrid(s)?p.cols.length+1:2;break;
      case "trans":n=isGrid(s)?p.rows.reduce((a2,r)=>a2+r.length+1,0):2;break;
      case "jointM":n=isGrid(s)?(2*p.W+2*p.H+(p.cols.length-1)*p.H+p.rows.reduce((a2,r,ci)=>a2+(r.length-1)*p.cols[ci],0))/1000:(2*p.W+2*p.H)/1000;break;}
    const k=accKey(s.id,a.code);acc[k]=(acc[k]||0)+n*(+a.qty||0)*q;});
  Object.keys(acc).forEach(k=>{const m=(s.accs||[]).find(a=>accKey(s.id,a.code)===k);if(m&&(!/M$|m2/.test(m.per)||/VİDA|برغي|SCREW/i.test(m.name)))acc[k]=Math.ceil(acc[k]-1e-9);else acc[k]=Math.round(acc[k]*100)/100;if(!acc[k])delete acc[k];});
  return acc;}
function templateAccs(s){const A=ST().acc,r=(code,name,price,per,qty,applies="all",minH=0)=>({code,name,price,per,qty,applies,minH});
  if(s.kind==="sliding")return [r("ROL","عجلة جرار",A.roller,"sash",2,"sliding"),r("CRS","قفل هلالي",A.crescent,"sash",0.5,"sliding"),r("HND","مقبض جرار",A.handle,"sash",1,"sliding"),r("BRS","فرشاة",A.brushM,"sashM",1,"sliding"),r("GSK","جوان زجاج",A.gasketM,"glassM",2),r("NROL","عجلة منخل",A.roller,"sash",2,"net")];
  if(s.kind==="door")return [r("DHG","مفصلة باب",A.doorHinge,"sash",3,"door"),r("DLK","قفل باب + سلندر",A.doorLock,"sash",1,"door"),r("DHD","مقبض باب",A.doorHandle,"sash",1,"door"),r("GSK","جوان زجاج",A.gasketM,"glassM",2),r("GSF","جوان درفة",A.gasketM,"sashM",1)];
  if(s.kind==="shutter")return [r("AXL","عمود محور",A.axle,"frameM",0.5),r("CAP","غطاء جانبي",A.boxCap,"pos",2),r("STR","شريط وبكرة",A.strap,"pos",1)];
  return [r("HND","مقبض",A.handle,"sash",1),r("HNG","مفصلة",A.hinge,"sash",2),r("HNG3","مفصلة إضافية (درفة طويلة)",A.hinge,"sash",1,"all",1200),r("ESP","إسبانيوليت",A.lock,"sash",1,"casement"),r("TLT","طقم قلاب",A.tiltKit,"sash",1,"tilt"),r("GSK","جوان زجاج",A.gasketM,"glassM",2),r("GSF","جوان درفة",A.gasketM,"sashM",1),r("CRN","زاوية تجميع",350,"corner",1)];}

   </div></div>`;
  const tp={...newPos(s.kind==="facade"||s.kind==="shutter"?s.kind:s.kind),sys:s.id,W:1200,H:1400,qty:1};if(isGrid(s)){tp.cols=[1200];tp.rows=[[1400]];tp.cells={"0-0":s.kind==="door"?"doorL":s.kind==="facade"?"tilt":"casL"};}

const WZ={step:1,p:null,q:"",kind:"",nc:1,nr:1,rh:[]};
const WZSTEPS=["نوع المقطع","التقسيم","القياسات","الفتحات","الزجاج / الحشوة","اللون والمقاطع","النتيجة والستوك"];
const WZKIND={sliding:"جرار",casement:"مفصلي / قلاب",door:"أبواب",facade:"واجهات",shutter:"أباجور"};
const WZFILL={
  casement:["fixed","casL","casR","tilt","tiltT","tiltL","tiltR","panel"],
  door:["fixed","doorL","doorR","casL","casR","tilt","tiltT","panel"],
  facade:["fixed","tiltT","tilt","casL","casR","panel"]};
const WZFN={fixed:"ثابت",casL:"مفصلي — مفصلات يسار",casR:"مفصلي — مفصلات يمين",tilt:"قلاب للداخل (مفصلات تحت)",tiltT:"قلاب للخارج (مفصلات فوق)",tiltL:"مفصلي+قلاب — يسار",tiltR:"مفصلي+قلاب — يمين",doorL:"باب — مفصلات يسار",doorR:"باب — مفصلات يمين",panel:"حشوة ألمنيوم مصمتة"};
const wzSplit=(T,n)=>{const a=Math.floor(T/n),r=[];for(let i=0;i<n;i++)r.push(i<n-1?a:T-a*(n-1));return r;};
const wzHasNet=s=>(LIB[s.id]||[]).some(x=>x[5]==="net")||s.kind==="sliding";
function openWizard(){WZ.added=null;WZ.exportOnly=false;WZ.scope="proj";WZ.step=1;WZ.p=null;WZ.q="";WZ.kind="";$("wizModal").hidden=false;renderWiz();}
function wzSkip(st){const s=WZ.p&&sys(WZ.p.sys);if(!s)return false;if(s.kind==="shutter")return st===4||st===5;return false;}
function wzGo(d){let n=WZ.step+d;while(n>1&&n<7&&wzSkip(n))n+=d;if(n<1||n>7)return;if(n>1&&!WZ.p)return;
  if(WZ.step===2&&d>0)wzApplyGrid(true);WZ.step=n;renderWiz();}
function wzPick(id){const s=ST().systems.find(x=>x.id===id);const p=newPos(s.kind);p.sys=id;p.infill={};p.name={sliding:"شباك جرار",casement:"شباك مفصلي",door:"باب",facade:"واجهة",shutter:"أباجور"}[s.kind];
  if(s.kind==="casement"){p.W=1200;p.H=1400;}
  p.net=s.kind==="sliding"&&wzHasNet(s);
  WZ.p=p;WZ.nc=isGrid(s)?p.cols.length:1;WZ.nr=isGrid(s)?(p.rows[0]||[1]).length:1;WZ.rh=isGrid(s)?[...p.rows[0]]:[];WZ.step=2;renderWiz();}
function wzApplyGrid(reset){const p=WZ.p,s=sys(p.sys);if(!isGrid(s))return;
  if(reset||p.cols.length!==WZ.nc)p.cols=wzSplit(p.W,WZ.nc);

      const r=await cloudRpc("lamsat_users",{p_name:CLOUD.name,p_pin:CLOUD.pin,p_action:"save",p_user:n,p_display:n,p_role:rl,p_newpin:pn||null});
      alertBar(r.error?("ما انحفظ: "+r.error):"انحفظ الموظف "+n);m.querySelector("#usrName").value="";m.querySelector("#usrPin").value="";loadUsers();};
    m.addEventListener("click",async e=>{const b=e.target.closest("[data-dis]");if(!b)return;
      const r=await cloudRpc("lamsat_users",{p_name:CLOUD.name,p_pin:CLOUD.pin,p_action:"disable",p_user:b.dataset.dis});alertBar(r.error?r.error:"انوقف حساب "+b.dataset.dis);loadUsers();});}
  m.hidden=false;loadUsers();
  async function loadUsers(){const L=m.querySelector("#usrList");try{const r=await cloudRpc("lamsat_users",{p_name:CLOUD.name,p_pin:CLOUD.pin,p_action:"list"});
    if(r.error)throw new Error(r.error);
    L.innerHTML='<table style="width:100%;border-collapse:collapse">'+r.users.map(u=>`<tr style="border-bottom:1px solid #eee;${u.active?"":"opacity:.45"}"><td dir="ltr" style="padding:6px">${esc(u.display)}</td><td>${ROLE_N[u.role]||u.role}</td><td>${u.active?"فعّال":"موقوف"}</td><td>${u.active&&u.name!==CLOUD.name?`<button type="button" class="btn" data-dis="${esc(u.name)}">إيقاف</button>`:""}</td></tr>`).join("")+'</table>';}
    catch(e){L.textContent="ما گدرت أجيب القائمة: "+e.message;}}
}
/* الدخول: كل موظف باسمه ورمزه (من السيرفر) */
try{$("empName").placeholder="اسم الموظف بالإنكليزي";$("empName").dir="ltr";}catch(_){}
const LOGIN_CACHE="lamsat-login-cache";
$("loginF").onsubmit=async e=>{e.preventDefault();const n=$("empName").value.trim(),pin=$("pin").value;
  if(!n){$("loginErr").textContent="اكتب اسمك بالإنكليزي";return;}
  $("loginErr").textContent="جاري التحقق…";let res=null,offline=false;
  try{res=await cloudRpc("lamsat_login",{p_name:n,p_pin:pin});}catch(_){offline=true;}
  if(offline){ // بدون نت: يقبل فقط اسم ورمز دخل بيهم قبل على نفس الجهاز
    let c={};try{c=JSON.parse(localStorage.getItem(LOGIN_CACHE)||"{}")}catch(_){}
    const k=n.toLowerCase(),h=cHash(k+"|"+pin);
    if(!c[k]||c[k].h!==h){$("loginErr").textContent="ماكو اتصال بالسيرفر، وهذا الحساب ما دخل قبل على هذا الجهاز";return;}
    res={role:c[k].role,display:c[k].display};}
  else if(res.error){$("loginErr").textContent="الاسم أو الرمز غير صحيح";return;}
  else{try{const c=JSON.parse(localStorage.getItem(LOGIN_CACHE)||"{}");c[n.toLowerCase()]={h:cHash(n.toLowerCase()+"|"+pin),role:res.role,display:res.display};localStorage.setItem(LOGIN_CACHE,JSON.stringify(c));}catch(_){}}
  $("loginErr").textContent="";USER=res.display;try{sessionStorage.setItem("lamsat-user",USER)}catch(_){}enter();
  cloudStart(n,pin,res.role);if(offline){CLOUD.err="بدون نت — يشتغل محلي";cloudBadge();}
  alertBar("أهلاً "+res.display+" ("+(ROLE_N[res.role]||res.role)+")");};
(()=>{try{const c=JSON.parse(sessionStorage.getItem("lamsat-cloud")||"null");if(c&&sessionStorage.getItem("lamsat-user"))cloudStart(c.name,c.pin,c.role);
  else if(sessionStorage.getItem("lamsat-user")){sessionStorage.removeItem("lamsat-user");location.reload();}}catch(_){}})();
/* إعادة رسم الشريط تخفي أزرار المسؤول عن الموظف */
{const rr=renderRibbon;renderRibbon=function(){rr.apply(this,arguments);applyRole();};}
/* أرشيف LogiKal على السيرفر: النسخة المحلية ترفعه مرة وحدة، والنسخة المنشورة تنزّله */
async function archiveSync(){
  try{
    const head=await cloudRpc("lamsat_archive_get",{p_name:CLOUD.name,p_pin:CLOUD.pin,p_after:2000000000,p_limit:1});
    if(head.error)return;const total=head.total;
    const emb=(typeof LK_EMBED!=="undefined")?LK_EMBED:null;
    if(emb&&total<emb.length&&CLOUD.role!=="staff"){
      for(let i=0;i<emb.length;i+=150){CLOUD.err="";const b=document.getElementById("cloudBadge");if(b)b.textContent=`☁ يرفع أرشيف LogiKal ${Math.min(i+150,emb.length)}/${emb.length}`;
        const r=await cloudRpc("lamsat_archive_put",{p_name:CLOUD.name,p_pin:CLOUD.pin,p_rows:emb.slice(i,i+150)});if(r.error)throw new Error(r.error);}
      cloudBadge();alertBar("انرفع أرشيف LogiKal للسيرفر ("+emb.length+" مشروع)");return;}
    if(!emb&&total){const have=(await LKA.all()).length;
      if(have<total){let after=0,got=0;
        while(true){const r=await cloudRpc("lamsat_archive_get",{p_name:CLOUD.name,p_pin:CLOUD.pin,p_after:after,p_limit:400});
          if(r.error||!r.rows.length)break;await LKA.put(r.rows);got+=r.rows.length;after=r.rows[r.rows.length-1].lk;
          const b=document.getElementById("cloudBadge");if(b)b.textContent=`☁ ينزّل أرشيف LogiKal ${got}/${total}`;}
        cloudBadge();}}
  }catch(e){console.warn("archive",e);}
}
{const cs=cloudStart;cloudStart=function(n,p,r){cs(n,p,r);setTimeout(archiveSync,3000);};}
